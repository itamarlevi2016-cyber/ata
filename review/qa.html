<!doctype html><html lang="he" dir="rtl"><head><base href="../"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בדיקת הקלטות — קול בטוח</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#193b3d;background:#f5f7f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}h1{margin-bottom:4px}.muted{color:#61777b}.panel{background:white;border:1px solid #d7e2e3;border-radius:16px;padding:16px;margin:16px 0;box-shadow:0 3px 14px #1233}button,select,input{font:inherit}button,a.action{border-radius:10px;border:1px solid #8fa9aa;padding:9px 13px;background:white;color:#114b4f;cursor:pointer;text-decoration:none}button.primary{background:#155e63;color:white}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffba70}input[type=search],select{padding:10px;border-radius:9px;border:1px solid #aac0bf;background:white;max-width:100%}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}article{border-top:1px solid #dce6e5;padding:16px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}.caption{font-size:1rem;line-height:1.8;white-space:pre-wrap}audio{max-width:100%;width:410px}small{display:block}.warn{font-size:.88rem;color:#865d14}.ok{color:#13734e}.tag{display:inline-block;background:#e5f2f0;border-radius:8px;padding:3px 7px;font-size:.82rem}.state{display:flex;gap:7px;flex-wrap:wrap;align-items:center}@media(max-width:730px){article{grid-template-columns:1fr}audio{width:100%}} textarea{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid #aac0bf;border-radius:8px;font:inherit;resize:vertical}label{display:block;margin-top:12px}details{margin-top:12px}</style></head><body><main class="wrap"><h1>בדיקת ההקלטות של ר׳ דוד</h1><p class="muted">מסך לבקרת איכות. קובצי השמע נשמרים באתר; סימוני הבדיקה נשמרים בדפדפן שלך בלבד. המסך אינו שולח מידע לשרת.</p><div class="panel"><div class="tools"><input id="search" type="search" placeholder="חיפוש בשיעור או בטקסט" aria-label="חיפוש"><select id="filter" aria-label="סינון מצב"><option value="all">הכול</option><option value="todo">טרם נבדקו</option><option value="bad">דורשים תיקון</option><option value="good">תקינים</option><option value="technical">סומנו לבדיקה טכנית</option></select><button id="export" class="primary">ייצוא תוצאות ל־CSV</button><a class="action" href="./index.html">חזרה לאתר</a></div><p id="counts" class="muted"></p><p id="storage-message" class="warn" role="status"></p></div><section class="panel" id="items" aria-label="הקלטות"></section></main><script type="module" src="js/qa.js"></script></body></html>
