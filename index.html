<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7e6e4">
<meta name="robots" content="noindex, nofollow">
<title>עלם – ניהול קליניקה</title>
<style>
  :root {
    --cream: #fdf7f2;
    --beige: #f3e6da;
    --pink: #f8dfe0;
    --pink-deep: #f0c4c8;
    --rose: #c98a96;
    --rose-dark: #a8606f;
    --text: #5a4349;
    --text-soft: #8d7479;
    --white: #fffdfb;
    --danger: #c0505f;
    --shadow: 0 6px 24px rgba(201, 138, 150, .18);
    --radius: 20px;
    --ease: cubic-bezier(.4, 0, .2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", "Heebo", "Assistant", "Rubik", system-ui, -apple-system, Arial, sans-serif;
    background: linear-gradient(160deg, var(--cream) 0%, var(--pink) 100%);
    color: var(--text);
    overflow: hidden;
    line-height: 1.5;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--pink-deep); outline-offset: 2px;
  }

  /* ---------- Screens ---------- */
  .screen {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    display: none; flex-direction: column;
    padding: 16px 18px;
    padding: max(env(safe-area-inset-top), 16px) 18px max(env(safe-area-inset-bottom), 16px);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .screen.active { display: flex; animation: screenIn .35s var(--ease); }
  .screen.back.active { animation-name: screenBack; }
  @keyframes screenIn { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  @keyframes screenBack { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  .container { width: 100%; max-width: 560px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }

  /* ---------- Lock ---------- */
  #lock { justify-content: center; align-items: center; }
  .lock-box { text-align: center; width: 100%; max-width: 320px; margin: auto; }
  .logo {
    font-size: 3rem; font-weight: 700; color: var(--rose-dark); letter-spacing: 2px; margin: 0;
  }
  .tagline { color: var(--text-soft); margin: 4px 0 28px; font-size: .95rem; }
  .dots { display: flex; justify-content: center; gap: 16px; margin-bottom: 28px; height: 18px; }
  .dot {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--rose); transition: background .2s, transform .2s;
  }
  .dot.filled { background: var(--rose); transform: scale(1.1); }
  .dots.shake { animation: shake .4s; }
  .dots.shake .dot { border-color: var(--danger); background: var(--danger); }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); }
  }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; direction: ltr; }
  .key {
    aspect-ratio: 1; border-radius: 50%; font-size: 1.7rem; font-weight: 500;
    background: var(--white); color: var(--text); box-shadow: var(--shadow);
    transition: transform .12s, background .2s;
  }
  .key:active { transform: scale(.92); background: var(--pink); }
  .key.ghost { background: transparent; box-shadow: none; font-size: 1.3rem; color: var(--text-soft); }
  .key.empty { visibility: hidden; }
  .lock-msg { min-height: 1.5em; margin-top: 18px; color: var(--danger); font-size: .9rem; }

  /* ---------- Headers & shared ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 18px; }
  h1.title { margin: 0; font-size: 1.6rem; color: var(--rose-dark); font-weight: 700; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 22px; border-radius: 999px; font-weight: 600; font-size: 1rem;
    transition: transform .12s, box-shadow .2s, background .2s, opacity .2s;
  }
  .btn:active { transform: scale(.96); }
  .btn-primary { background: linear-gradient(135deg, var(--rose), var(--rose-dark)); color: #fff; box-shadow: var(--shadow); }
  .btn-soft { background: var(--white); color: var(--rose-dark); box-shadow: var(--shadow); }
  .btn-back { padding: 12px 22px; font-size: 1.05rem; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }

  /* ---------- Dashboard ---------- */
  .search {
    width: 100%; padding: 13px 18px; border-radius: 999px; border: 1.5px solid var(--beige);
    background: var(--white); font: inherit; color: var(--text); margin-bottom: 16px;
  }
  .patient-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; padding-bottom: 24px; }
  .patient {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: var(--white); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
    text-align: start; transition: transform .15s, background .2s;
  }
  .patient:active { transform: scale(.98); background: var(--pink); }
  .avatar {
    flex: none; width: 46px; height: 46px; border-radius: 50%;
    background: linear-gradient(135deg, var(--pink-deep), var(--beige));
    display: grid; place-items: center; color: var(--rose-dark); font-weight: 700; font-size: 1.2rem;
  }
  .patient .info { flex: 1; min-width: 0; }
  .patient .name { font-weight: 600; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .patient .meta { color: var(--text-soft); font-size: .85rem; }
  .chev { color: var(--rose); font-size: 1.3rem; }
  .empty-state { text-align: center; color: var(--text-soft); margin: auto; padding: 40px 12px; }
  .empty-state .big { font-size: 3rem; }

  /* ---------- Patient file ---------- */
  .patient-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
  .patient-head h2 { margin: 0; font-size: 1.5rem; color: var(--rose-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    color: var(--text-soft); transition: background .2s, color .2s; flex: none;
  }
  .icon-btn:hover, .icon-btn:active { background: var(--pink); color: var(--danger); }
  .card { background: var(--white); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .card h3 { margin: 0 0 12px; font-size: 1.05rem; color: var(--text); }
  .rec-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .rec-btn { flex: 1; min-width: 180px; padding: 14px 22px; }
  .rec-btn.recording { background: linear-gradient(135deg, #d9697b, var(--danger)); animation: pulse 1.6s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(192, 80, 95, .45); } 70% { box-shadow: 0 0 0 14px rgba(192, 80, 95, 0); } 100% { box-shadow: 0 0 0 0 rgba(192, 80, 95, 0); }
  }
  .rec-status { color: var(--text-soft); font-size: .9rem; display: flex; align-items: center; gap: 8px; }
  .rec-status .led { width: 10px; height: 10px; border-radius: 50%; background: var(--beige); }
  .rec-status.on .led { background: var(--danger); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .warn { margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: #fbeaea; color: var(--danger); font-size: .9rem; }
  textarea {
    width: 100%; min-height: 150px; resize: vertical; padding: 14px; border-radius: 14px;
    border: 1.5px solid var(--beige); background: var(--cream); font: inherit; color: var(--text); margin-top: 14px; line-height: 1.7;
  }
  .save-row { display: flex; justify-content: flex-end; margin-top: 12px; }
  .entries { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .entry { position: relative; background: var(--cream); border: 1px solid var(--beige); border-radius: 16px; padding: 14px 16px 14px 48px; }
  .entry .stamp { font-size: .8rem; color: var(--rose-dark); font-weight: 600; margin-bottom: 4px; }
  .entry .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
  .entry .del { position: absolute; top: 8px; left: 6px; }
  .none { color: var(--text-soft); text-align: center; padding: 14px 0; margin: 0; }

  /* ---------- Modal & toast ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(90, 67, 73, .35); display: grid; place-items: center; padding: 20px;
    opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; z-index: 50; backdrop-filter: blur(3px);
  }
  .overlay.show { opacity: 1; visibility: visible; transition: opacity .25s, visibility 0s; }
  .modal {
    background: var(--white); border-radius: 24px; padding: 24px; width: 100%; max-width: 380px;
    box-shadow: 0 16px 48px rgba(90, 67, 73, .25); transform: translateY(14px) scale(.97); transition: transform .25s var(--ease);
  }
  .overlay.show .modal { transform: none; }
  .modal h3 { margin: 0 0 14px; color: var(--rose-dark); }
  .modal p { margin: 0 0 14px; }
  .modal input[type=text] {
    width: 100%; padding: 13px 16px; border-radius: 14px; border: 1.5px solid var(--beige); background: var(--cream); font: inherit; color: var(--text);
  }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .btn-danger { background: var(--danger); color: #fff; }
  .toast {
    position: fixed; bottom: max(env(safe-area-inset-bottom), 20px); left: 50%; transform: translate(-50%, 30px);
    background: var(--text); color: #fff; padding: 11px 22px; border-radius: 999px; font-size: .92rem;
    opacity: 0; transition: opacity .3s, transform .3s var(--ease); z-index: 60; pointer-events: none; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 380px) { .key { font-size: 1.4rem; } .keypad { gap: 10px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01s !important; } }
</style>
<noscript><style>body::after{content:"יש להפעיל JavaScript";display:block;text-align:center;padding:20px}</style></noscript>
</head>
<body>

<!-- Lock -->
<section class="screen active" id="lock" aria-label="מסך נעילה">
  <div class="lock-box">
    <h1 class="logo">עלם</h1>
    <p class="tagline">הזינו קוד גישה להמשך</p>
    <div class="dots" id="dots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <span class="key empty"></span>
      <button class="key" data-k="0">0</button>
      <button class="key ghost" data-k="del" aria-label="מחיקה">⌫</button>
    </div>
    <div class="lock-msg" id="lockMsg" role="alert"></div>
  </div>
</section>

<!-- Dashboard -->
<section class="screen" id="dashboard" aria-label="רשימת מטופלים">
  <div class="container">
    <div class="topbar">
      <h1 class="title">המטופלים שלי</h1>
      <button class="btn btn-primary" id="addPatient">＋ הוספת מטופל</button>
    </div>
    <input class="search" id="search" type="search" placeholder="חיפוש מטופל..." aria-label="חיפוש מטופל" autocomplete="off">
    <ul class="patient-list" id="patientList"></ul>
    <div style="margin-top:auto;text-align:center;padding-top:10px">
      <button class="btn btn-soft" id="lockBtn">🔒 נעילה</button>
    </div>
  </div>
</section>

<!-- Patient file -->
<section class="screen" id="patient" aria-label="תיק מטופל">
  <div class="container">
    <div class="topbar">
      <button class="btn btn-soft btn-back" id="backBtn">→ חזרה</button>
    </div>
    <div class="patient-head">
      <h2 id="pName"></h2>
      <button class="icon-btn" id="delPatient" aria-label="מחיקת מטופל" title="מחיקת מטופל">🗑</button>
    </div>

    <div class="card">
      <h3>הקלטה ותמלול</h3>
      <div class="rec-row">
        <button class="btn btn-primary rec-btn" id="recBtn" aria-pressed="false">🎙 הקלטה ותמלול</button>
        <div class="rec-status" id="recStatus"><span class="led"></span><span id="recText">לא מקליט</span></div>
      </div>
      <div class="warn" id="srWarn" hidden>הדפדפן אינו תומך בזיהוי דיבור. מומלץ להשתמש ב-Chrome או Safari עדכני. ניתן עדיין להקליד סיכום ידנית.</div>
      <textarea id="transcript" placeholder="התמלול יופיע כאן בזמן אמת... ניתן גם לערוך ולהקליד ידנית." aria-label="תצוגה מקדימה של התמלול"></textarea>
      <div class="save-row"><button class="btn btn-primary" id="saveBtn">💾 שמירת סיכום</button></div>
    </div>

    <div class="card">
      <h3>סיכומים שמורים</h3>
      <ul class="entries" id="entries"></ul>
    </div>
  </div>
</section>

<!-- Modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <h3 id="mTitle"></h3>
    <div id="mBody"></div>
    <div class="actions">
      <button class="btn btn-soft" id="mCancel">ביטול</button>
      <button class="btn btn-primary" id="mOk">אישור</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  const PASSCODE = '1234';
  const STORE_KEY = 'alem_clinic_v1';
  const $ = id => document.getElementById(id);

  /* ---------- Storage ---------- */
  let db = { patients: [] };
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if (parsed && Array.isArray(parsed.patients)) db = parsed;
    } catch (e) { /* storage unavailable or corrupted */ }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); return true; }
    catch (e) { toast('לא ניתן לשמור – האחסון המקומי חסום או מלא'); return false; }
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const getPatient = id => db.patients.find(p => p.id === id);

  /* ---------- UI helpers ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }
  const fmtDate = ts => new Date(ts).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' });

  const screens = ['lock', 'dashboard', 'patient'];
  function show(name) {
    const back = screens.indexOf(name) < screens.findIndex(x => $(x).classList.contains('active'));
    screens.forEach(x => {
      const el = $(x);
      el.classList.toggle('back', back);
      el.classList.toggle('active', x === name);
    });
    $(name).scrollTop = 0;
  }

  /* ---------- Modal ---------- */
  let modalDone = null;
  function openModal({ title, body, okText = 'אישור', danger = false, input = false, onOk }) {
    $('mTitle').textContent = title;
    const mb = $('mBody'); mb.textContent = '';
    let field = null;
    if (input) {
      field = document.createElement('input');
      field.type = 'text'; field.maxLength = 60; field.placeholder = 'שם המטופל'; field.setAttribute('aria-label', 'שם המטופל');
      mb.appendChild(field);
    } else {
      const p = document.createElement('p'); p.textContent = body; mb.appendChild(p);
    }
    const ok = $('mOk'); ok.textContent = okText;
    ok.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
    modalDone = () => {
      const v = field ? field.value.trim() : true;
      if (field && !v) { field.focus(); return; }
      closeModal(); onOk(v);
    };
    if (field) field.onkeydown = e => { if (e.key === 'Enter') modalDone(); };
    $('overlay').classList.add('show');
    setTimeout(() => (field || ok).focus(), 60);
  }
  function closeModal() { $('overlay').classList.remove('show'); modalDone = null; }
  $('mOk').onclick = () => modalDone && modalDone();
  $('mCancel').onclick = closeModal;
  $('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  /* ---------- Lock screen ---------- */
  let entered = '';
  function renderDots(err) {
    const dots = $('dots');
    [...dots.children].forEach((d, i) => d.classList.toggle('filled', i < entered.length));
    dots.classList.toggle('shake', !!err);
  }
  function pressKey(k) {
    $('lockMsg').textContent = '';
    if (k === 'del') { entered = entered.slice(0, -1); renderDots(); return; }
    if (entered.length >= PASSCODE.length) return;
    entered += k; renderDots();
    if (entered.length === PASSCODE.length) {
      if (entered === PASSCODE) {
        setTimeout(() => { entered = ''; renderDots(); showDashboard(); }, 180);
      } else {
        renderDots(true); $('lockMsg').textContent = 'קוד שגוי, נסו שוב';
        if (navigator.vibrate) navigator.vibrate(120);
        setTimeout(() => { entered = ''; renderDots(); }, 450);
      }
    }
  }
  $('keypad').addEventListener('click', e => {
    const b = e.target.closest('[data-k]'); if (b) pressKey(b.dataset.k);
  });
  document.addEventListener('keydown', e => {
    if (!$('lock').classList.contains('active')) return;
    if (/^\d$/.test(e.key)) pressKey(e.key);
    else if (e.key === 'Backspace') pressKey('del');
  });
  $('lockBtn').onclick = () => { stopRecording(); currentId = null; show('lock'); };

  /* ---------- Dashboard ---------- */
  function showDashboard() { renderPatients(); show('dashboard'); }
  function renderPatients() {
    const q = $('search').value.trim();
    const list = $('patientList'); list.textContent = '';
    const items = db.patients.filter(p => !q || p.name.includes(q));
    if (!items.length) {
      const d = document.createElement('div'); d.className = 'empty-state';
      d.innerHTML = '<div class="big">🌸</div>';
      const t = document.createElement('p');
      t.textContent = db.patients.length ? 'לא נמצאו מטופלים תואמים' : 'עדיין אין מטופלים. לחצו על "הוספת מטופל" כדי להתחיל.';
      d.appendChild(t); list.appendChild(d); return;
    }
    items.forEach(p => {
      const li = document.createElement('li');
      const b = document.createElement('button'); b.className = 'patient';
      const av = document.createElement('span'); av.className = 'avatar'; av.textContent = [...p.name][0];
      const info = document.createElement('span'); info.className = 'info';
      const n = document.createElement('div'); n.className = 'name'; n.textContent = p.name;
      const m = document.createElement('div'); m.className = 'meta';
      m.textContent = p.entries.length ? `${p.entries.length} סיכומים` : 'אין סיכומים עדיין';
      info.append(n, m);
      const c = document.createElement('span'); c.className = 'chev'; c.textContent = '‹';
      b.append(av, info, c);
      b.onclick = () => openPatient(p.id);
      li.appendChild(b); list.appendChild(li);
    });
  }
  $('search').addEventListener('input', renderPatients);
  $('addPatient').onclick = () => openModal({
    title: 'הוספת מטופל', input: true, okText: 'הוספה',
    onOk: name => {
      db.patients.push({ id: uid(), name, created: Date.now(), entries: [] });
      db.patients.sort((a, b) => a.name.localeCompare(b.name, 'he'));
      if (save()) toast('המטופל נוסף');
      renderPatients();
    }
  });

  /* ---------- Patient file ---------- */
  let currentId = null;
  function openPatient(id) {
    const p = getPatient(id); if (!p) return;
    currentId = id;
    $('pName').textContent = p.name;
    $('transcript').value = '';
    renderEntries(); setRecUi(false);
    show('patient');
  }
  $('backBtn').onclick = () => { stopRecording(); currentId = null; showDashboard(); };
  $('delPatient').onclick = () => {
    const p = getPatient(currentId); if (!p) return;
    openModal({
      title: 'מחיקת מטופל', danger: true, okText: 'מחיקה',
      body: `למחוק את "${p.name}" וכל הסיכומים שלו? לא ניתן לשחזר.`,
      onOk: () => {
        stopRecording();
        db.patients = db.patients.filter(x => x.id !== currentId);
        save(); currentId = null; showDashboard(); toast('המטופל נמחק');
      }
    });
  };
  function renderEntries() {
    const p = getPatient(currentId); const ul = $('entries'); ul.textContent = '';
    if (!p || !p.entries.length) {
      const li = document.createElement('li'); li.className = 'none'; li.textContent = 'אין סיכומים שמורים'; ul.appendChild(li); return;
    }
    [...p.entries].sort((a, b) => b.ts - a.ts).forEach(en => {
      const li = document.createElement('li'); li.className = 'entry';
      const st = document.createElement('div'); st.className = 'stamp'; st.textContent = fmtDate(en.ts);
      const tx = document.createElement('div'); tx.className = 'txt'; tx.textContent = en.text;
      const del = document.createElement('button'); del.className = 'icon-btn del'; del.textContent = '✕';
      del.setAttribute('aria-label', 'מחיקת סיכום'); del.title = 'מחיקת סיכום';
      del.onclick = () => openModal({
        title: 'מחיקת סיכום', body: 'למחוק את הסיכום הזה?', danger: true, okText: 'מחיקה',
        onOk: () => {
          p.entries = p.entries.filter(x => x.id !== en.id); save(); renderEntries(); toast('הסיכום נמחק');
        }
      });
      li.append(st, tx, del); ul.appendChild(li);
    });
  }
  $('saveBtn').onclick = () => {
    const p = getPatient(currentId); const text = $('transcript').value.trim();
    if (!p) return;
    if (!text) { toast('אין טקסט לשמירה'); return; }
    if (recording) stopRecording();
    p.entries.push({ id: uid(), ts: Date.now(), text });
    if (save()) { $('transcript').value = ''; renderEntries(); toast('הסיכום נשמר'); }
    else p.entries.pop();
  };

  /* ---------- Speech recognition ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null, recording = false, baseText = '';
  if (!SR) { $('srWarn').hidden = false; $('recBtn').disabled = true; }

  function setRecUi(on, label) {
    const b = $('recBtn'); b.classList.toggle('recording', on); b.setAttribute('aria-pressed', on);
    b.textContent = on ? '⏹ עצירת הקלטה' : '🎙 הקלטה ותמלול';
    $('recStatus').classList.toggle('on', on);
    $('recText').textContent = label || (on ? 'מקליט...' : 'לא מקליט');
  }
  function joinText(a, b) { return a && b ? a.replace(/\s+$/, '') + ' ' + b : a + b; }

  function startRecording() {
    if (!SR || recording) return;
    const ta = $('transcript');
    recording = true;
    baseText = ta.value;           // text already in the preview before this utterance
    listen();
    setRecUi(true);

    // One short session per utterance (continuous = false). Each session's result
    // list is rebuilt from scratch on every event, so the preview is overwritten
    // with base + current utterance and can never accumulate duplicate finals.
    function listen() {
      const r = new SR();
      recog = r;
      r.lang = 'he-IL'; r.continuous = false; r.interimResults = true; r.maxAlternatives = 1;
      r.onresult = e => {
        if (recog !== r) return;   // ignore events from a stale session
        let text = '';
        for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
        ta.value = joinText(baseText, text.trim());
        ta.scrollTop = ta.scrollHeight;
      };
      r.onerror = e => {
        if (recog !== r) return;
        const fatal = { 'not-allowed': 'אין הרשאה למיקרופון', 'service-not-allowed': 'אין הרשאה למיקרופון',
                        'audio-capture': 'לא נמצא מיקרופון', 'network': 'שגיאת רשת בזיהוי הדיבור' }[e.error];
        if (fatal) { toast(fatal); stopRecording(); }
      };
      r.onend = () => {
        if (recog !== r || !recording) return;
        baseText = ta.value;       // commit the finished utterance, then listen again
        setTimeout(() => {
          if (!recording) return;
          try { listen(); } catch (err) { stopRecording(); }
        }, 150);
      };
      try { r.start(); }
      catch (err) { recog = null; recording = false; setRecUi(false); toast('לא ניתן להתחיל הקלטה'); }
    }
  }
  function stopRecording() {
    if (!recording && !recog) return;
    recording = false;
    if (recog) { const r = recog; recog = null; try { r.stop(); } catch (e) {} }
    setRecUi(false);
  }
  $('recBtn').onclick = () => recording ? stopRecording() : startRecording();
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopRecording(); });

  /* ---------- Init ---------- */
  load();
  renderDots();
  window.addEventListener('storage', e => {
    if (e.key === STORE_KEY) { load(); if ($('dashboard').classList.contains('active')) renderPatients(); }
  });
})();
</script>
</body>
</html>
